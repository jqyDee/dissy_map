services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000-8002:8000"
    env_file:
      - .env
    environment:
      - LAMBDA_URL=${LAMBDA_URL}
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped