[package]
name = "node"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
const_format = "0.2.37"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "noise", "yamux", "mdns", "identify", "ping", "macros", "gossipsub", "request-response", "json"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
