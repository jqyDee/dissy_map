<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tic-Tac-Toe</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            background: #f0f2f5;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            margin-bottom: 20px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        #status {
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Tic-Tac-Toe</h1>
    <div id="status">Turn: Player X</div>
    <div id="board"></div>
    <button id="reset-btn" onclick="resetGame()">Restart Game</button>
    <div id="download-area" style="margin-top: 20px;"></div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameOver = false;

        const boardEl = document.getElementById("board");
        const statusEl = document.getElementById("status");
        const downloadArea = document.getElementById("download-area");

        function renderBoard() {
            boardEl.innerHTML = "";
            board.forEach((val, i) => {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.innerText = val;
                cell.onclick = () => makeMove(i);
                boardEl.appendChild(cell);
            });
        }

        function makeMove(i) {
            if (board[i] || gameOver) return;
            board[i] = currentPlayer;
            checkWin();
            if (!gameOver) {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                statusEl.innerText = `Turn: Player ${currentPlayer}`;
            }
            renderBoard();
        }

        const wins = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function checkWin() {
            for (let [a, b, c] of wins) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    gameOver = true;
                    statusEl.innerText = `Winner: Player ${board[a]}!`;
                    generateBitmap(board[a]);
                    return;
                }
            }
            if (!board.includes("")) {
                gameOver = true;
                statusEl.innerText = "It's a Draw!";
                generateBitmap("Draw");
            }
        }

        async function generateBitmap(winner) {
            statusEl.innerText = `Game Over (${winner}). Rendering Bitmap...`;

            try {
                const res = await fetch(`http://${window.location.hostname}:8000/api/render-bitmap`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({board, winner, "size": 1200})
                });

                if (!res.ok) throw new Error("Server error rendering bitmap");

                // 1. Convert response to a binary Blob
                const blob = await res.blob();

                // 2. Create a local Object URL representing the binary data
                const imageUrl = URL.createObjectURL(blob);

                // 3. Render the image directly on the page and provide a download link
                downloadArea.innerHTML = `
          <div style="text-align: center; margin-top: 15px;">
            <h3>Generated Bitmap Certificate:</h3>
            <img src="${imageUrl}" alt="Tic-Tac-Toe Result" style="border: 2px solid #333; margin-bottom: 10px;" />
            <br>
            <a href="${imageUrl}" download="result.png">
              <button style="background: #28a745; padding: 10px 18px; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Download .png
              </button>
            </a>
          </div>
        `;
                statusEl.innerText = `Winner: ${winner}!`;
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Failed to render bitmap image.";
            }
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameOver = false;
            downloadArea.innerHTML = "";
            statusEl.innerText = "Turn: Player X";
            renderBoard();
        }

        renderBoard();
    </script>
</body>

</html>
